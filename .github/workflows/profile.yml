name: Render profile README

on:
  schedule:
    - cron: "0 3 * * *" # daily, 03:00 UTC
  push:
    paths:
      - "scripts/render-profile.mjs"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Render SVGs
        run: node scripts/render-profile.mjs
        env:
          GH_USER: ${{ github.repository_owner }}
          # Optional PAT (read access) saved as STATS_TOKEN to include private-repo data.
          GH_TOKEN: ${{ secrets.STATS_TOKEN || secrets.GITHUB_TOKEN }}
      - name: Commit if changed
        run: |
          git config user.name "profile-bot"
          git config user.email "profile-bot@users.noreply.github.com"
          git add assets/*.svg
          git diff --cached --quiet || (git commit -m "chore: refresh profile" && git push)
